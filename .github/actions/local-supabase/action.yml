name: Local Supabase
description: >
  Boots a throwaway Supabase (Postgres 17 + GoTrue + PostgREST + Storage in
  Docker) on the runner and replays the schema from the migration manifest
  (pnpm db:local:reset). Loopback only: db:local:reset, the integration
  suite and ui-shots all refuse any non-loopback host, so a misconfigured
  runner fails loudly rather than writing to production. Never takes
  secrets. Shared by ci.yml and ui-shots.yml; run setup-workspace first.

runs:
  using: composite
  steps:
    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: 2.95.4

    # Registry throttling ("toomanyrequests ... allowed: 44000/minute" on
    # ghcr.io, seen repeatedly 2026-10-26/27 even when logged in) made
    # `supabase start` flaky, so the images are cached across runs:
    #   hit  -> `docker load` the tarball; `supabase start` finds every image
    #           locally and pulls nothing.
    #   miss -> `supabase start` pulls (with the retry loop below), then the
    #           images of the containers it started are `docker save`d to a
    #           zstd tarball that actions/cache uploads when the job ends.
    # Key = CLI version + hash of supabase/config.toml and this file (which
    # fix the set of started services, hence the set of images). Bumping the
    # CLI version or the exclude list below changes the key.
    # Only the services the suites use are started (see SUPABASE_EXCLUDE):
    # fewer images to pull, a smaller cache, a faster boot.
    - name: Restore Supabase image cache
      id: image-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/supabase-images/images.tar.zst
        key: supabase-images-2.95.4-${{ hashFiles('supabase/config.toml', '.github/actions/local-supabase/action.yml') }}

    - name: Load cached Supabase images
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        zstd -dc ~/.cache/supabase-images/images.tar.zst | docker load
        docker images --format '{{.Repository}}:{{.Tag}}' | sort

    # ghcr.io throttled this one large image for over an hour on 2026-10-27
    # ("toomanyrequests", even when logged in and with retries). Supabase
    # publishes the same images on public.ecr.aws, so on a cache miss pull it
    # from there (falling back to ghcr.io) and tag it with the name the CLI
    # expects; `supabase start` then finds it locally and never asks ghcr.io.
    - name: Pre-pull Postgres image (ECR mirror)
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -uo pipefail
        want=ghcr.io/supabase/postgres:17.6.1.106
        if docker image inspect "$want" >/dev/null 2>&1; then exit 0; fi
        for attempt in 1 2 3; do
          for src in public.ecr.aws/supabase/postgres:17.6.1.106 "$want"; do
            if docker pull "$src"; then
              [ "$src" = "$want" ] || docker tag "$src" "$want"
              exit 0
            fi
          done
          sleep $((attempt * 30))
        done
        echo "could not pre-pull $want; supabase start will try itself"
        exit 0

    # Excluded: studio (dashboard), imgproxy (image transforms), edge-runtime
    # (functions), logflare + vector (analytics/log shipping), supavisor
    # (pooler, already off in config.toml), postgres-meta (studio's backend)
    # and realtime (no test, script or app code subscribes to it; the
    # notification bell is documented as realtime-free). Kept: postgres,
    # gotrue (auth), postgrest (rest), storage-api (storage-isolation and
    # photo-role integration tests), kong (the :54321 gateway every client
    # talks to) and mailpit (auth mail sink; tiny).
    - name: Start Supabase
      shell: bash
      env:
        SUPABASE_EXCLUDE: realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
        # Pull every service image from Supabase's public.ecr.aws mirror
        # instead of ghcr.io, which throttled CI for hours on 2026-10-27.
        # The CLI (2.95.4) reads INTERNAL_IMAGE_REGISTRY; every image we start
        # (postgres, gotrue, postgrest, storage-api, kong, mailpit) is on ECR.
        SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          # Attempts 1-2 pull from public.ecr.aws; the last one falls back to
          # ghcr.io, since each registry has throttled us on its own day.
          if [ "$attempt" = 3 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io; fi
          if supabase start -x "$SUPABASE_EXCLUDE"; then exit 0; fi
          echo "supabase start failed (attempt $attempt); retrying after $((attempt * 60))s"
          supabase stop --no-backup || true
          sleep $((attempt * 60))
        done
        echo "supabase start failed after 3 attempts"
        exit 1

    # Runs only after a successful start on a cache miss. Failure to save is
    # never fatal: the cache is an optimisation, the start already worked.
    - name: Save Supabase images for the cache
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -uo pipefail
        mkdir -p ~/.cache/supabase-images
        # Every Supabase image on the runner, not just running containers':
        # the first cache (2026-10-27) held only 4 of 6, so a later hit still
        # pulled postgrest/storage-api and ran into the registry's data limit.
        images="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^(public\.ecr\.aws|ghcr\.io)/supabase/' | grep -v '<none>' | sort -u)"
        echo "Supabase images on this runner:"
        echo "$images"
        if [ -z "$images" ]; then echo "no images found; not caching"; exit 0; fi
        # shellcheck disable=SC2086
        if docker save $images | zstd -T0 -3 -o ~/.cache/supabase-images/images.tar.zst; then
          ls -lh ~/.cache/supabase-images/images.tar.zst
        else
          echo "docker save failed; not caching"
          rm -f ~/.cache/supabase-images/images.tar.zst
        fi

    - name: Replay schema from the manifest
      shell: bash
      run: pnpm db:local:reset
