name: Local Supabase
description: >
  Boots a throwaway Supabase (Postgres 17 + GoTrue + PostgREST + Storage in
  Docker) on the runner and replays the schema from the migration manifest
  (pnpm db:local:reset). Loopback only: db:local:reset, the integration
  suite and ui-shots all refuse any non-loopback host, so a misconfigured
  runner fails loudly rather than writing to production. Never takes
  secrets. Shared by ci.yml and ui-shots.yml; run setup-workspace first.

runs:
  using: composite
  steps:
    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: 2.95.4

    # Docker Hub sometimes answers image pulls with "toomanyrequests" (seen
    # twice on 2026-10-26). Retry with a back-off instead of failing the run;
    # images pulled by an earlier attempt are cached, so retries pull less.
    - name: Start Supabase
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if supabase start; then exit 0; fi
          echo "supabase start failed (attempt $attempt); retrying after $((attempt * 60))s"
          supabase stop --no-backup || true
          sleep $((attempt * 60))
        done
        echo "supabase start failed after 3 attempts"
        exit 1

    - name: Replay schema from the manifest
      shell: bash
      run: pnpm db:local:reset
