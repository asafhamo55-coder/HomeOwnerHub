name: Setup workspace
description: >
  pnpm 10.33.0 + Node 22 (pnpm store cached by setup-node) and a frozen
  install. Shared by ci.yml and ui-shots.yml. Run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10.33.0

    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
