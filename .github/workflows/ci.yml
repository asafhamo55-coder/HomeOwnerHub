name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
      # Vercel's production branch: PRs into it must pass the same gates.
      - claude/phase1-homeownerhub-setup-MILNu

concurrency:
  # One run per branch/PR; cancel any in-flight earlier runs.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      # No tsconfig.json in this repo includes tests/integration/, so the
      # step above never compiles it — a type error there would pass
      # every check in this job while being invisible to CI. This is a
      # separate program (tsconfig.integration.json) specifically so it
      # does.
      - name: Typecheck integration tests
        run: pnpm typecheck:integration

      # scripts/release-notes is not in any package, so turbo's typecheck
      # never sees it; this is its own program.
      - name: Typecheck release-notes scripts
        run: pnpm typecheck:scripts

      # BL-070 user guide. The compiled guide is committed like a lockfile:
      # regenerate it and fail on any difference, so a markdown edit can't
      # ship without its compiled module (or the reverse).
      - name: Guide is up to date
        run: |
          pnpm guide:build
          git diff --exit-code -- apps/hoa/src/generated/guide.ts

      # Fails when an article points at a screenshot, route, [[button
      # label]] or article that no longer exists (docs/specs/2026-10-17-user-guide.md §5.3).
      - name: Guide check
        run: pnpm guide:check

      # "Ask the guide" eval, retrieval only: the rules classifier, BM25 and
      # the refuse-before-the-model gate over content/guide/_eval. No model
      # call and no key (GUIDE_EVAL_MODEL is never set here).
      - name: Guide eval
        run: pnpm guide:eval

      - name: Build
        run: pnpm turbo run build
        env:
          # Builds need NEXT_PUBLIC_* present so the bundles don't crash on
          # missing constants. Real values come from Vercel at deploy time;
          # these are inert defaults for the CI build verification.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_HOA_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_EVICTION_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_PM_URL: https://ci-placeholder.vercel.app

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.95.4

      # Starts Postgres 17 + GoTrue + PostgREST + Storage in Docker.
      # The integration suite refuses to run against anything but
      # loopback, so a misconfigured runner fails loudly rather than
      # writing to production.
      - name: Start Supabase
        run: supabase start

      - name: Replay schema from the manifest
        run: pnpm db:local:reset

      - name: Integration tests
        run: pnpm test:integration
