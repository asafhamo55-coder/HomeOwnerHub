name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

concurrency:
  # One run per branch/PR; cancel any in-flight earlier runs.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build
        env:
          # Builds need NEXT_PUBLIC_* present so the bundles don't crash on
          # missing constants. Real values come from Vercel at deploy time;
          # these are inert defaults for the CI build verification.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_HOA_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_EVICTION_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_PM_URL: https://ci-placeholder.vercel.app
