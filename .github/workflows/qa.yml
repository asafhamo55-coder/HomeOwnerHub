name: QA

# Pre-deployment QA super-agent gate.
#
# Runs every test category that gates deployment (functional, security, e2e,
# performance, penetration, exploratory) via scripts/qa.sh. Must pass before
# a change is merged to main — Vercel only redeploys after merge, so a RED
# QA run effectively blocks deployment.
#
# - Stages 1-2 run against the workspace (typecheck, build, audit, secret
#   scan, SAST) — they need no network access to Vercel.
# - Stages 3-6 hit the live preview / production URLs. They run after
#   stages 1-2 pass and target $TARGET_URL.

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for live stages (default: HOA prod)'
        required: false
        default: ''
      strict:
        description: 'Fail if any stage skipped because a tool is missing'
        required: false
        default: '0'

concurrency:
  group: qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static QA (functional + security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.run.outcome == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for gitleaks history scan

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install gitleaks
        run: |
          set -e
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep --version

      - name: Run QA static stages
        id: run
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_HOA_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_EVICTION_URL: https://ci-placeholder.vercel.app
          NEXT_PUBLIC_PM_URL: https://ci-placeholder.vercel.app
        run: |
          chmod +x scripts/qa.sh
          # Stages 1-2 only — live URLs are gated behind a successful deploy.
          scripts/qa.sh functional
          scripts/qa.sh security --report /tmp/qa-security.json

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-static-logs
          path: |
            /tmp/qa-*.log
            /tmp/qa-*.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## QA static stages"
            echo ""
            echo "Status: ${{ steps.run.outcome }}"
            echo ""
            for s in functional security; do
              log="/tmp/qa-${s}.log"
              [ -f "$log" ] || continue
              echo "<details><summary>$s (last 30 lines)</summary>"
              echo ""
              echo '```'
              tail -30 "$log"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  live:
    name: Live QA (e2e + performance + penetration + exploratory)
    runs-on: ubuntu-latest
    needs: static
    if: needs.static.outputs.passed == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup jq + curl
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve target URL
        id: target
        run: |
          URL="${{ github.event.inputs.target_url }}"
          if [ -z "$URL" ]; then URL="https://home-owner-hub-hoa.vercel.app"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run QA live stages
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          STRICT: ${{ github.event.inputs.strict || '0' }}
        run: |
          chmod +x scripts/qa.sh
          scripts/qa.sh e2e
          scripts/qa.sh performance
          scripts/qa.sh penetration
          scripts/qa.sh exploratory --report /tmp/qa-live.json

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-logs
          path: |
            /tmp/qa-*.log
            /tmp/qa-*.json
            zap-baseline.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## QA live stages"
            echo "Target: ${{ steps.target.outputs.url }}"
            echo ""
            if [ -f /tmp/qa-live.json ]; then
              echo '```json'
              jq . /tmp/qa-live.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
