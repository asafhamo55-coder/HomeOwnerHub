<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HomeownerHub welcome video scene</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="top">
    <img src="brand/logo-full-dark.svg" alt="HomeownerHub">
    <div class="tag">Example screens,<br>pretend names</div>
  </div>
  <div id="mid"></div>
  <div id="cap"><p id="cap-text"></p></div>
  <div id="side">
    <div class="brand"><img src="brand/logo-full-dark.svg" alt="HomeownerHub"><div class="tag">Example screens,<br>pretend names</div></div>
    <div><h2 id="side-title"></h2><div id="capslot"></div></div>
    <div class="tag" id="side-foot"></div>
  </div>
  <div id="poster" hidden></div>
  <div id="fade"></div>
  <div id="pre" style="position:absolute;inset:0;background:#FF00FF;z-index:99"></div>
</div>
<script src="build/timeline.js"></script>
<script src="icons.js"></script>
<script src="scenes.js"></script>
<script src="runtime.js"></script>
</body>
</html>
