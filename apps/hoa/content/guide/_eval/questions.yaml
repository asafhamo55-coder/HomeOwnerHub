# "Ask the guide" eval set (BL-070, spec §6.3). Not published: the `_`
# prefix keeps this folder out of the compiled guide.
#
# `pnpm guide:eval` runs every question through the same retrieval, gate and
# rules classifier the /api/help/ask route uses, with no model call. CI runs
# that. GUIDE_EVAL_MODEL=1 also calls the model (needs AI_API_KEY); that mode
# is for a person before a guide release, never CI.
#
# expect:
#   <article-id>  a how-to: that article must be in the top 3 retrieved and
#                 the gate must let the question through to the model
#   refuse        a refusal canary: a feature HomeownerHub does not have.
#                 The gate must refuse before the model is called. Each one
#                 was checked against the code before it was added.
#   rules         a question about the community's own rules: routed to
#                 Ask the Docs, never answered from the guide
#
# role: admin | board | resident (the viewer). route: the page the question
# was asked from (optional; the drawer sends it).

questions:
  # ── How-to: board ─────────────────────────────────────────────────────
  - { id: h01, role: admin, expect: start-board-admin, q: "Where do I start setting up our HOA?" }
  - { id: h02, role: admin, expect: start-board-admin, q: "What is the setup checklist on my dashboard?" }
  - { id: h03, role: board, expect: setup-properties-residents, q: "How do I add a property?" }
  - { id: h04, role: admin, expect: setup-properties-residents, q: "How do I add an owner to a home?" }
  - { id: h05, role: admin, expect: setup-properties-residents, q: "Can I import all our homes from a spreadsheet?" }
  - { id: h05s1, role: board, expect: properties-record-a-sale, q: "A home was sold. How do I change it to the new owner?" }
  - { id: h05s2, role: admin, expect: properties-record-a-sale, q: "How do I record a sale and remove the seller's portal access?" }
  - { id: h05s3, role: board, expect: properties-record-a-sale, q: "Where do I see previous owners of a house?" }
  - { id: h06, role: admin, expect: members-invite-board, q: "How do I invite another board member?" }
  - { id: h07, role: admin, expect: members-invite-board, q: "How do I change someone's role to admin?" }
  - { id: h08, role: board, expect: dues-generate-monthly, q: "How do I bill this month's dues?" }
  - { id: h09, role: admin, expect: dues-generate-monthly, q: "How do I add a special assessment charge?" }
  - { id: h10, role: board, expect: dues-record-payment, q: "An owner paid by check. How do I record it?" }
  - { id: h11, role: admin, expect: dues-record-payment, q: "How do I mark a dues charge as paid?" }
  - { id: h12, role: admin, expect: dues-record-payment, q: "How do residents pay online with Zelle?" }
  - { id: h13, role: board, expect: violations-report-and-letter, q: "How do I report a violation?" }
  - { id: h14, role: board, expect: violations-report-and-letter, q: "How do I approve a violation letter before it is sent?", route: /violations/approval-queue }
  - { id: h15, role: admin, expect: violations-report-and-letter, q: "What is the cure period and how do I close a violation?" }
  - { id: h15i1, role: board, expect: violations-inspection-mode, q: "How do I log violations from my phone while walking the neighborhood?" }
  - { id: h15i2, role: board, expect: violations-inspection-mode, q: "Can I do a drive-by inspection and take photos of several homes?" }
  - { id: h15i3, role: admin, expect: violations-inspection-mode, q: "What happens to my inspection photos if I have no signal?", route: /inspect }
  - { id: h15i4, role: board, expect: violations-inspection-mode, q: "What does 2 waiting to upload mean on the inspection page?" }
  - { id: h16, role: board, expect: arc-review-application, q: "How do I approve or deny an ARC application?" }
  - { id: h17, role: board, expect: arc-review-application, q: "Where do architectural requests from residents show up?" }
  - { id: h17a, role: board, expect: arc-review-application, q: "What does the AI review on an ARC application suggest?" }
  - { id: h17b, role: board, expect: arc-review-application, q: "How do I ask the resident for more information on an architectural application?" }
  - { id: h17c, role: board, expect: arc-review-application, q: "Does the AI look at the photos attached to an ARC application?" }
  - { id: h17d, role: board, expect: arc-review-application, q: "How do I edit the decision letter before approving an architectural application with conditions?" }
  - { id: h18, role: board, expect: meetings-schedule-and-minutes, q: "How do I schedule a board meeting?" }
  - { id: h19, role: admin, expect: meetings-schedule-and-minutes, q: "Can AI write the minutes from a transcript?" }
  - { id: h20, role: board, expect: meetings-schedule-and-minutes, q: "How do I print the board packet?", route: /meetings/1f3a/packet }
  - { id: h21, role: board, expect: approvals-queue, q: "What is waiting in the approvals queue?" }
  - { id: h22, role: admin, expect: approvals-queue, q: "How do I approve a scanned bill?" }
  - { id: h23, role: board, expect: communications-send-announcement, q: "How do I send an announcement email to all residents?" }
  - { id: h24, role: board, expect: communications-send-announcement, q: "Can I send a text message to residents?" }
  - { id: h25, role: admin, expect: documents-governing-and-ask, q: "How do I upload our CC&Rs?" }
  - { id: h26, role: board, expect: documents-governing-and-ask, q: "What is the difference between Ask the Docs and Ask the guide?" }

  # ── How-to: resident ──────────────────────────────────────────────────
  - { id: r01, role: resident, expect: resident-portal-basics, q: "How do I pay my dues?" }
