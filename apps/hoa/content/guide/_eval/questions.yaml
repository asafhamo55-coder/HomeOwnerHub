  # ── Refusal canaries: features HomeownerHub does not have ─────────────
  - { id: c01, role: admin, expect: refuse, q: "Can residents book the clubhouse for a party?" }
  - { id: c02, role: admin, expect: refuse, q: "How do I turn on autopay by credit card?" }
  - { id: c03, role: board, expect: refuse, q: "How do I run an online election with secret ballots?" }
  - { id: c04, role: admin, expect: refuse, q: "How do I sync our books with QuickBooks?" }
  - { id: c05, role: board, expect: refuse, q: "How do I give visitors a guest pass for the gate?" }
  - { id: c06, role: resident, expect: refuse, q: "Can I sell my old bike in a community marketplace?" }
  - { id: c07, role: admin, expect: refuse, q: "How do I order an estoppel certificate for a home sale?" }
  - { id: c08, role: resident, expect: refuse, q: "Can I switch the portal to Spanish?" }
  - { id: c09, role: resident, expect: refuse, q: "Is there a forum where neighbors can chat?" }
  - { id: c10, role: admin, expect: refuse, q: "How do I run a background check on a new tenant?" }

  # ── Rules questions: Ask the Docs, not the guide ──────────────────────
  - { id: d01, role: resident, expect: rules, q: "Can I paint my front door red?" }
  - { id: d02, role: board, expect: rules, q: "What does our CC&R say about fences?" }
  - { id: d03, role: resident, expect: rules, q: "Am I allowed to keep two dogs?" }
