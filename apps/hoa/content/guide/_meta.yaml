    articles:
      - approvals-queue
      - violations-report-and-letter
      - arc-review-application
      - meetings-schedule-and-minutes
      - communications-send-announcement
  - id: several-hoas
    label: I manage several HOAs
    description: Quick reference for managers who switch between communities.
    roles: [admin]
    articles:
      - members-invite-board
      - approvals-queue
      - dues-record-payment
      - violations-report-and-letter
  - id: resident-start
